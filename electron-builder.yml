appId: app.steve.companion
productName: STEVE
directories:
  output: dist
files:
  - out/**
  - package.json
# uiohook-napi and nut-js ship prebuilt N-API binaries that work with any Electron version,
# so skip recompiling them (which would need a C++ toolchain on the build machine).
npmRebuild: false
# Native addons must live outside the asar archive.
# Playwright is unpacked because the browser agent runs it as a separate process.
asarUnpack:
  - '**/*.node'
  - node_modules/@playwright/**
  - node_modules/playwright/**
  - node_modules/playwright-core/**
mac:
  target: dmg
  category: public.app-category.productivity
  # Ad-hoc signature: runs on the Mac that built it, no Apple account needed.
  # shortcut: replace '-' with your "Developer ID Application" certificate name before sharing installers.
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: STEVE listens only while you hold the talk keys.
win:
  target: nsis
