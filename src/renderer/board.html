<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- No CSP here: the srcdoc frame would inherit it. The visual brings its own (see src/main/visual.ts). -->
    <title>STEVE</title>
    <style>
      * { box-sizing: border-box; }
      /* The window itself is transparent: 3D models float on the user's screen, 2D visuals sit on a card. */
      html, body { margin: 0; height: 100%; background: transparent; color: var(--text); font: 14px/1.4 var(--font-ui); overflow: hidden; }
      button, select { font: inherit; color: inherit; }
      #bar {
        position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 2;
        display: flex; align-items: center; gap: 4px; height: 38px; max-width: calc(100% - 12px); padding: 0 4px 0 4px;
        background: var(--surface); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 6px 20px #0003;
        -webkit-app-region: drag; user-select: none; opacity: 0; transition: opacity .25s;
      }
      /* Shown while the pointer is over the window, while it has focus, and for a moment after each new visual. */
      body:hover #bar, #bar:focus-within, body.fresh #bar { opacity: 1; }
      #bar button, #bar select { -webkit-app-region: no-drag; }
      .icon { width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; display: grid; place-items: center; cursor: pointer; flex: none; }
      .icon:hover { background: var(--sunken); }
      .icon:disabled { opacity: .3; cursor: default; background: none; }
      .icon svg { width: 16px; height: 16px; }
      #title { font: 650 15px/1.2 var(--font-steve); font-variation-settings: 'CASL' 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; min-width: 0; }
      #history { max-width: 160px; height: 28px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 6px; }
      #save { height: 28px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--steve); color: var(--ink); font-weight: 650; cursor: pointer; flex: none; }
      #save:hover { background: var(--steve-deep); }
      #saved { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
      iframe {
        position: absolute; top: 50px; left: 6px; width: calc(100% - 12px); height: calc(100% - 56px);
        border: 0; border-radius: 14px; background: #0f1115; box-shadow: 0 12px 36px #0006;
        color-scheme: normal; /* same as the visual's, or Chromium paints an opaque backdrop behind it */
      }
      iframe.clear { top: 46px; left: 0; width: 100%; height: calc(100% - 46px); border-radius: 0; background: transparent; box-shadow: none; }
      /* "Making ..." while the model writes the visual, or why it didn't work. */
      #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; margin: 0; max-width: min(420px, calc(100% - 32px)); padding: 12px 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 12px 36px #0004; }
      #status[hidden] { display: none; }
      #status.error { border-radius: 12px; }
      #status .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--steve); box-shadow: 0 0 0 1.5px var(--ink); animation: pulse 1s ease-in-out infinite alternate; }
      #status.error .dot { background: var(--rec); animation: none; }
      @keyframes pulse { to { transform: scale(.55); opacity: .6; } }
      @media (prefers-reduced-motion: reduce) { #bar { transition: none; } #status .dot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="bar">
      <button id="back" class="icon" title="Previous visual" aria-label="Previous visual" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg></button>
      <button id="forward" class="icon" title="Next visual" aria-label="Next visual" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7" /></svg></button>
      <span id="title" title="Drag here to move. Click any part of the visual to ask about it.">Visuals</span>
      <select id="history" aria-label="All visuals"></select>
      <span id="saved" aria-live="polite"></span>
      <button id="save" title="Save this visual as a web page you can open in any browser">Save</button>
      <button id="size" class="icon" title="Make bigger" aria-label="Make bigger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7" /></svg></button>
      <button id="close" class="icon" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
    </div>
    <!-- No allow-same-origin: the visual gets an opaque origin and cannot reach this page or Node. -->
    <iframe id="frame" sandbox="allow-scripts" title="Visual"></iframe>
    <p id="status" role="status" hidden><span class="dot"></span><span id="status-text"></span></p>
    <script type="module" src="./board.ts"></script>
  </body>
</html>
