<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>STEVE overlay</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font: 14px/1.35 var(--font-ui); }

      /* ---------- Marker ink: everything STEVE draws on the screen ---------- */
      #ink { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: opacity .6s; }
      #ink.fade { opacity: 0; }
      #ink .under { fill: none; stroke: var(--ink); stroke-opacity: .55; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      #ink .stroke { fill: none; stroke: var(--steve); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      #ink .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawin .55s cubic-bezier(.3,.7,.3,1) forwards; }
      #ink .tag rect { fill: var(--steve); stroke: var(--ink); stroke-width: 1.5; }
      #ink .tag text { fill: var(--ink); font: 650 14px var(--font-steve); font-variation-settings: 'CASL' 1; }
      #ink .ring { fill: none; stroke: var(--steve); stroke-width: 3.5; transform-box: fill-box; transform-origin: center; animation: ripple 1.4s ease-out infinite; }
      #ink .ring + .ring { animation-delay: .7s; }
      #ink .spot { fill: var(--steve); stroke: var(--ink); stroke-width: 2; }
      @keyframes drawin { to { stroke-dashoffset: 0 } }
      @keyframes ripple { from { transform: scale(.35); opacity: 1 } to { transform: scale(1.7); opacity: 0 } }

      /* ---------- The buddy ---------- */
      /* #buddy sits on the point of interest; the character floats beside it, offset by --cx/--cy. */
      #buddy { position: fixed; left: 0; top: 0; transition: transform 90ms linear; will-change: transform; --cx: 10px; --cy: 10px; --lx: -1.4px; --ly: -1.4px; --tilt: 0deg; }
      #buddy.flying { transition: transform 650ms cubic-bezier(.2,.85,.25,1); }
      #buddy[hidden] { display: none; }
      .char { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px;
        transform: translate(var(--cx), var(--cy)) rotate(var(--tilt)); transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
      .char svg { width: 44px; height: 44px; overflow: visible; filter: drop-shadow(0 3px 5px rgb(20 16 40 / .35)); }
      .bob { animation: bob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      .body { fill: var(--steve); stroke: var(--ink); stroke-width: 2.4; }
      .white { fill: #fff; stroke: var(--ink); stroke-width: 1.4; }
      .pupil { fill: var(--ink); transform: translate(var(--lx), var(--ly)); transition: transform .25s ease-out; }
      .lid { transform-box: fill-box; transform-origin: center; transition: transform 90ms; }
      #buddy.blink .lid { transform: scaleY(.12); }
      .cheek { fill: #ff8a8a; opacity: .45; }
      .mouth { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; }
      .talk { fill: var(--ink); opacity: 0; transform-box: fill-box; transform-origin: center; }
      @keyframes bob { 50% { transform: translateY(-2.5px) scale(1.02, .98) } }

      /* Listening: a red halo, wide eyes. */
      .halo { position: absolute; inset: 4px; border-radius: 50%; border: 2.5px solid var(--rec); opacity: 0; }
      [data-state="listening"] .halo { animation: halo 1.1s ease-out infinite; }
      [data-state="listening"] .pupil { r: 2.8px; }
      @keyframes halo { from { transform: scale(.9); opacity: .9 } to { transform: scale(1.55); opacity: 0 } }
      /* Thinking: eyes wander, a thought bubble. */
      .dots { position: absolute; left: 18px; top: -22px; display: none; gap: 3px; padding: 4px 6px; border-radius: 10px; background: var(--surface); border: 1.5px solid var(--ink); }
      .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); animation: dot 1s ease-in-out infinite; }
      .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
      [data-state="thinking"] .dots { display: flex; }
      [data-state="thinking"] .pupil { animation: wander 2.4s ease-in-out infinite; }
      @keyframes dot { 50% { transform: translateY(-3px); opacity: .4 } }
      @keyframes wander { 0%, 100% { transform: translate(-1.6px, -1.8px) } 45% { transform: translate(1.6px, -1.8px) } 70% { transform: translate(0, -2px) } }
      /* Speaking and pointing: the mouth moves. */
      [data-state="speaking"] .mouth, [data-state="pointing"] .mouth { opacity: 0; }
      [data-state="speaking"] .talk, [data-state="pointing"] .talk { opacity: 1; animation: talk .26s ease-in-out infinite alternate; }
      @keyframes talk { from { transform: scaleY(.25) } to { transform: scaleY(1) } }
      /* Working (building a visual, using the computer): focused eyes, an orbiting spark. */
      [data-state="working"] .pupil { transform: translate(0, 1.4px); }
      .spark { position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; background: var(--steve); border: 1.5px solid var(--ink); display: none; }
      [data-state="working"] .spark { display: block; animation: orbit 1s linear infinite; }
      @keyframes orbit { from { transform: rotate(0) translateX(27px) } to { transform: rotate(360deg) translateX(27px) } }

      /* What STEVE is saying, in a speech bubble beside it. */
      #caption { position: absolute; left: calc(var(--cx) + 26px); top: calc(var(--cy) - 8px); max-width: 340px; width: max-content;
        padding: 7px 12px 8px; border-radius: 14px 14px 14px 4px; background: var(--surface); color: var(--text);
        border: 1.5px solid var(--ink); box-shadow: 0 6px 22px rgb(20 16 40 / .28); font: 500 15px/1.35 var(--font-steve); font-variation-settings: 'CASL' 1; }
      #buddy.flip #caption { left: auto; right: calc(26px - var(--cx)); border-radius: 14px 14px 4px 14px; }
      #caption:empty { display: none; }

      /* "STEVE is in control": a banner and a glowing screen edge. */
      #banner { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
        padding: 8px 10px 8px 14px; border-radius: 999px; background: var(--ink); color: #fff; font-weight: 600; box-shadow: 0 6px 24px rgb(0 0 0 / .4); }
      #banner::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--rec); animation: rec 1.2s ease-in-out infinite; }
      #banner kbd { font: 600 12px var(--font-ui); padding: 3px 7px; border-radius: 6px; background: #ffffff1f; border: 1px solid #ffffff33; }
      #banner[hidden], #banner[hidden] + #edge { display: none; }
      #edge { position: fixed; inset: 0; box-shadow: inset 0 0 0 3px var(--rec), inset 0 0 40px rgb(255 90 95 / .35); pointer-events: none; }
      @keyframes rec { 50% { opacity: .35 } }

      /* "Your screen was just captured." */
      #flash { position: fixed; inset: 0; box-shadow: inset 0 0 0 4px var(--steve); opacity: 0; pointer-events: none; }
      #flash.on { animation: flash .55s ease-out; }
      @keyframes flash { 15% { opacity: 1 } }

      @media (prefers-reduced-motion: reduce) {
        .bob, #ink .ring, .halo, .dots i, [data-state="thinking"] .pupil, .talk, .spark, #banner::before { animation: none !important; }
        #buddy.flying, .char { transition-duration: 1ms; }
      }
    </style>
  </head>
  <body>
    <svg id="ink" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- A slight wobble so STEVE's drawings look hand-marked. -->
        <filter id="marker" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="1" seed="7" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <marker id="head" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
          <path d="M1 1.5L10 6L1 10.5z" fill="#ffd23f" stroke="#221f2e" stroke-width="1.2" stroke-linejoin="round" />
        </marker>
      </defs>
      <g id="shapes"></g>
    </svg>

    <div id="buddy" data-state="idle" hidden>
      <div class="char">
        <div class="halo"></div>
        <div class="spark"></div>
        <svg viewBox="-22 -22 44 44" aria-hidden="true">
          <g class="bob">
            <path class="body" d="M0-16C10-16 17-9 17 1S10 17 0 17-17 11-17 1-10-16 0-16Z" />
            <ellipse class="cheek" cx="-10.5" cy="5" rx="2.6" ry="1.5" /><ellipse class="cheek" cx="10.5" cy="5" rx="2.6" ry="1.5" />
            <g transform="translate(-5.5 -3)"><g class="lid"><ellipse class="white" rx="4.4" ry="5.2" /><circle class="pupil" r="2.3" /></g></g>
            <g transform="translate(5.5 -3)"><g class="lid"><ellipse class="white" rx="4.4" ry="5.2" /><circle class="pupil" r="2.3" /></g></g>
            <path class="mouth" d="M-3.5 6.5Q0 9.5 3.5 6.5" />
            <ellipse class="talk" cx="0" cy="7.5" rx="3" ry="2.6" />
          </g>
        </svg>
        <div class="dots"><i></i><i></i><i></i></div>
      </div>
      <div id="caption"></div>
    </div>

    <div id="banner" hidden></div>
    <div id="edge"></div>
    <div id="flash"></div>
    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
